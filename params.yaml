# Single source of truth for every tunable value in the pipeline.
# DVC tracks these per stage: changing a value re-runs only the stages that depend on it.

seed: 42

# Thread counts are pinned so multithreaded BLAS/OpenMP math gives identical results run to run.
runtime:
  num_threads: 4

data:
  movielens:
    url: https://files.grouplens.org/datasets/movielens/ml-32m.zip
    # Pinned 2026-10-02 after checking the MD5 against GroupLens' published ml-32m.zip.md5.
    sha256: e4a68655d7386b8f95f2f2424b2ff975dfdd15ffd59e0d864a14dca43e99d6ee

# Values chosen from the per-year / candidate-split analysis in notebooks/01_eda.ipynb.
preprocess:
  start_date: "2015-01-01"  # activity roughly triples in 2015; modern catalog; CPU budget
  end_date: null  # keep everything up to the end of the dataset (2023-10-13)
  positive_threshold: 3.5  # ~2/3 of ratings count as "liked"
  max_items: 20000  # bounds EASE's item x item matrix
  min_user_interactions: 5
  min_item_interactions: 10

# Global temporal split: train < val_start <= val < test_start <= test.
split:
  val_start: "2022-01-01"
  test_start: "2023-01-01"

# Starting values, not tuned yet: Phase 3 searches these on the validation split with Optuna.
models:
  popularity:
    half_life_days: null  # null = plain counts; a number down-weights old interactions
  item_knn:
    k: 100  # neighbours kept per movie
    similarity: cosine  # cosine | bm25
    shrinkage: 20.0  # cosine only: damps similarities backed by few users
    bm25_k1: 1.2  # bm25 only
    bm25_b: 0.75  # bm25 only

evaluation:
  ks: [10, 20]
  batch_size: 1024  # users scored at once; memory only, no effect on results
  onboarding:
    n_history: 10  # a new user's first likes stand in for the movies rated at sign-up
  history_segments: [20, 100]  # warm users split into <20, 20-99 and >=100 liked movies
  bootstrap:
    n_resamples: 1000
    confidence: 0.95
  latency_users: 200  # single-user calls timed for p50/p95 (MLflow only)

mlflow:
  experiment_name: movie-recsys
  # Used only when MLFLOW_TRACKING_URI is unset, so the project works with no accounts.
  # (MLflow 3.x refuses the old ./mlruns folder store, so local runs use SQLite.)
  local_db: mlflow.db
  local_artifacts: mlartifacts
