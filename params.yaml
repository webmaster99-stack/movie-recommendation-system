# Single source of truth for every tunable value in the pipeline.
# DVC tracks these per stage: changing a value re-runs only the stages that depend on it.

seed: 42

# Thread counts are pinned so multithreaded BLAS/OpenMP math gives identical results run to run.
runtime:
  num_threads: 4

data:
  movielens:
    url: https://files.grouplens.org/datasets/movielens/ml-32m.zip
    # Pinned 2026-10-02 after checking the MD5 against GroupLens' published ml-32m.zip.md5.
    sha256: e4a68655d7386b8f95f2f2424b2ff975dfdd15ffd59e0d864a14dca43e99d6ee

# Values chosen from the per-year / candidate-split analysis in notebooks/01_eda.ipynb.
preprocess:
  start_date: "2015-01-01"  # activity roughly triples in 2015; modern catalog; CPU budget
  end_date: null  # keep everything up to the end of the dataset (2023-10-13)
  positive_threshold: 3.5  # ~2/3 of ratings count as "liked"
  max_items: 20000  # bounds EASE's item x item matrix
  min_user_interactions: 5
  min_item_interactions: 10

# Global temporal split: train < val_start <= val < test_start <= test.
split:
  val_start: "2022-01-01"
  test_start: "2023-01-01"

# Tuned values, copied from tuning/<model>.json (`python -m recsys.tuning.tune <model>` searches
# them on the validation split). A test fails if the two disagree. Values that are not in the
# model's search space under `tuning` below are fixed choices.
models:
  popularity:
    half_life_days: 30  # an interaction counts half as much every 30 days; null = plain counts
  item_knn:
    k: 853  # neighbours kept per movie
    similarity: cosine  # cosine | bm25 (bm25 adds bm25_k1 and bm25_b)
    shrinkage: 19.53  # cosine only: damps similarities backed by few users
  ials:
    factors: 110  # length of each movie/user vector
    regularization: 19.25
    alpha: 2.945  # weight of a liked movie relative to an unseen one
    iterations: 21
  ease:
    l2: 1138.0  # the one real hyperparameter: higher = smoother, more popular recommendations
    # Weights kept per movie (largest absolute values), stored sparse. null = all 19,642,
    # a dense 1.5 GB matrix. Not searched: set from the pruning study (`ease_pruning` below).
    keep_per_item: 500
  sasrec:
    hidden_dim: 64
    n_blocks: 2
    n_heads: 1
    max_len: 50  # most recent likes the model reads
    dropout: 0.2395
    learning_rate: 0.002352
    weight_decay: 0.0
    epochs: 10  # ~2 min each on a 4-core laptop CPU, which is what caps this model
    batch_size: 256
    n_negatives: 1024  # random movies per batch in the softmax; null = the whole catalog
    max_users: null  # train on a random subset of users to cut CPU time; null = everyone
  # Recency variants: the model above plus a prior for what is popular right now
  # (see models/recency.py). They reuse the trained model, so these two values are all they add.
  item_knn_recency:
    half_life_days: 246  # the prior halves an interaction's weight every this many days
    weight: 0.05231  # how much the prior counts against the personalised score; 0 = base model
  ials_recency:
    half_life_days: 7
    weight: 4.108
  ease_recency:
    half_life_days: 11
    weight: 9.071
  sasrec_recency:
    half_life_days: 11
    weight: 2.086

# Optuna search per model (seeded TPE, one trial at a time, so a rerun repeats the same trials).
# `enqueue` lists starting points tried first: the untuned Phase 2/3 values, so the search
# can only match or beat them. `when` samples a value only if an earlier one has the given value.
tuning:
  metric: ndcg_at_10  # averaged over all validation users, warm and onboarding together
  models:
    popularity:
      grid: true  # one cheap hyperparameter: try every value once instead of sampling
      space:
        half_life_days:
          {type: categorical, choices: [null, 7, 14, 21, 30, 45, 60, 90, 180, 365, 730]}
    item_knn:
      n_trials: 30
      space:
        k: {type: int, low: 10, high: 1000, log: true}
        similarity: {type: categorical, choices: [cosine, bm25]}
        shrinkage: {type: float, low: 0.0, high: 200.0, when: {similarity: cosine}}
        bm25_k1: {type: float, low: 0.1, high: 3.0, when: {similarity: bm25}}
        bm25_b: {type: float, low: 0.0, high: 1.0, when: {similarity: bm25}}
      enqueue:
        - {k: 100, similarity: cosine, shrinkage: 20.0}
    ials:
      n_trials: 30
      space:
        factors: {type: int, low: 32, high: 256, log: true}
        regularization: {type: float, low: 0.001, high: 100.0, log: true}
        alpha: {type: float, low: 1.0, high: 50.0, log: true}
        iterations: {type: int, low: 5, high: 30}
      enqueue:
        - {factors: 64, regularization: 0.01, alpha: 1.0, iterations: 15}
    ease:
      n_trials: 8
      space:
        l2: {type: float, low: 20.0, high: 5000.0, log: true}
      enqueue:
        - {l2: 500.0}
    sasrec:
      n_trials: 6  # ~20 min per trial on CPU, so a small search with epochs held fixed
      space:
        learning_rate: {type: float, low: 0.0003, high: 0.005, log: true}
        dropout: {type: float, low: 0.0, high: 0.4}
      enqueue:
        - {learning_rate: 0.001, dropout: 0.2}
    # A trial only recomputes the prior and rescores validation; the base model in models/ is
    # reused, so it must be trained (`dvc repro train`) before its variant is tuned.
    item_knn_recency: &recency_search
      n_trials: 20
      space:
        half_life_days: {type: int, low: 7, high: 365, log: true}
        weight: {type: float, low: 0.05, high: 20.0, log: true}
      enqueue:
        - {half_life_days: 30, weight: 0.5}
    ials_recency: *recency_search
    ease_recency: *recency_search
    sasrec_recency: *recency_search

evaluation:
  ks: [10, 20]
  batch_size: 1024  # users scored at once; memory only, no effect on results
  onboarding:
    n_history: 10  # a new user's first likes stand in for the movies rated at sign-up
  history_segments: [20, 100]  # warm users split into <20, 20-99 and >=100 liked movies
  bootstrap:
    n_resamples: 1000
    confidence: 0.95
  latency_users: 200  # single-user calls timed for p50/p95 (MLflow only)

# EASE scored with the full matrix (null) and with only the strongest weights per movie.
# models.ease.keep_per_item is the smallest value that loses at most max_relative_drop of
# tuning.metric (stage `ease_pruning`); a test fails if the two disagree.
ease_pruning:
  keep_per_item: [null, 2000, 1000, 500, 200, 100]
  max_relative_drop: 0.001

# Paired significance tests between models (stage `compare`).
comparison:
  alpha: 0.05  # significance level, after Holm's correction for the number of pairs

# The model to serve is the best tuning.metric on validation among those that fit the budget.
selection:
  max_model_size_mb: 150  # the API host has 512 MB of RAM in total

mlflow:
  experiment_name: movie-recsys
  registered_model: movie-recsys  # registry name; aliases `challenger` and `champion`
  # Used only when MLFLOW_TRACKING_URI is unset, so the project works with no accounts.
  # (MLflow 3.x refuses the old ./mlruns folder store, so local runs use SQLite.)
  local_db: mlflow.db
  local_artifacts: mlartifacts
