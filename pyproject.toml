[project]
name = "recsys"
version = "0.1.0"
description = "Reproducible movie recommender: 5 algorithms compared, best one served as a web app."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "mlflow>=2.17",
    "threadpoolctl>=3.5",
    "pandera[pandas]>=0.33.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "implicit>=0.7.3",
    "optuna>=5.0.0",
    "torch>=2.14.1",
]

[dependency-groups]
# Everything the serving image installs (`uv sync --only-group api`), and nothing else: no
# pandas, implicit, torch or mlflow, which would not fit the host's 512 MB.
api = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]
dev = [
    "dvc>=3.55",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML",
    "pandas-stubs",
]
notebook = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
]

[tool.uv]
default-groups = ["dev", "api"]  # the API's tests run in the same environment as the rest

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Third-party Claude Code skills ship their own Python scripts; they aren't project code.
extend-exclude = [".claude"]
src = ["src", "api"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "api/recsys_api"]
mypy_path = ["api"]

[[tool.mypy.overrides]]
# MLflow is huge; analyzing its source makes mypy take minutes. Treat it as untyped.
module = ["mlflow", "mlflow.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
pythonpath = ["api"]
addopts = "-q"

# CPU-only PyTorch on every platform: PyPI's Linux wheels bundle gigabytes of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
