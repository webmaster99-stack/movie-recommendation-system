stages:
  download:
    cmd: python -m recsys.data.download
    deps:
      - src/recsys/data/download.py
    params:
      - data.movielens
    outs:
      - data/raw/ml-32m

  validate:
    cmd: python -m recsys.data.validate
    deps:
      - data/raw/ml-32m
      - src/recsys/data/validate.py
      - src/recsys/utils/io.py
    outs:
      - data/interim
    metrics:
      - metrics/data_validation.json:
          cache: false

  preprocess:
    cmd: python -m recsys.data.preprocess
    deps:
      - data/interim/ratings.parquet
      - src/recsys/data/preprocess.py
      - src/recsys/utils/io.py
    params:
      - preprocess
    outs:
      - data/processed/interactions.parquet
      - data/processed/user_map.parquet
      - data/processed/item_map.parquet
    metrics:
      - metrics/preprocess.json:
          cache: false

  split:
    cmd: python -m recsys.data.split
    deps:
      - data/processed/interactions.parquet
      - src/recsys/data/split.py
      - src/recsys/data/preprocess.py  # reuses to_unix
      - src/recsys/utils/io.py
    params:
      - split
    outs:
      - data/processed/splits
    metrics:
      - metrics/split.json:
          cache: false

  items:
    cmd: python -m recsys.data.items
    deps:
      - data/processed/item_map.parquet
      - data/interim/movies.parquet
      - data/interim/links.parquet
      - src/recsys/data/items.py
      - src/recsys/utils/io.py
    outs:
      - data/processed/items.parquet

  # One train and one evaluate stage per model, e.g. `dvc repro evaluate@item_knn`.
  train:
    foreach: [popularity, item_knn]
    do:
      cmd: python -m recsys.models.train ${item}
      deps:
        - data/processed/splits/train.parquet
        - data/processed/item_map.parquet
        - src/recsys/models/__init__.py
        - src/recsys/models/base.py
        - src/recsys/models/train.py
        - src/recsys/models/${item}.py
        - src/recsys/utils/io.py
      params:
        - models.${item}
      outs:
        - models/${item}

  evaluate:
    foreach: [popularity, item_knn]
    do:
      cmd: python -m recsys.evaluation.evaluate ${item}
      deps:
        - models/${item}
        - data/processed/splits/train.parquet
        - data/processed/splits/val.parquet
        - src/recsys/evaluation
        - src/recsys/models/__init__.py
        - src/recsys/models/base.py
        - src/recsys/models/${item}.py
        - src/recsys/utils/io.py
      params:
        - seed  # drives the bootstrap resampling
        - evaluation
      outs:
        - data/evaluation/val/${item}.parquet
      metrics:
        - metrics/val_${item}.json:
            cache: false
