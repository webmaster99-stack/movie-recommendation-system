name: Deploy

# Builds the API image with the registry's `champion` model inside, pushes it to ghcr.io and
# tells Render to run exactly that image. It runs after CI has passed on main, and by hand
# (Actions > Deploy > Run workflow) after a promotion, which changes the champion without
# changing the code.
#
# The frontend is not deployed here: Vercel builds `web/` itself on every push.
#
# Secrets: MLFLOW_TRACKING_URI, MLFLOW_TRACKING_USERNAME, MLFLOW_TRACKING_PASSWORD (DagsHub,
# to read the registry) and RENDER_DEPLOY_HOOK_URL. Variable: API_URL (the service's public
# address). Without the hook the image is still built and pushed, but nothing is deployed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in the order they were started.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/webmaster99-stack/movie-recommendation-system-api

jobs:
  api:
    # `workflow_run` also fires for pull requests and for failed runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # The commit CI tested, which is not always the newest one on main.
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
      - name: Install (exactly as locked)
        run: uv sync --frozen

      - name: Download the champion bundle
        id: champion
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          # Without the address, the pipeline's local fallback would look in an empty registry.
          test -n "$MLFLOW_TRACKING_URI" || { echo "::error::MLFLOW_TRACKING_URI is not set"; exit 1; }
          uv run python -m recsys.registry.pull --out bundle --summary "$GITHUB_OUTPUT"

      - name: The API scores this bundle exactly as the pipeline does
        run: uv run pytest api/tests/test_model_parity.py

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          build-args: |
            MODEL_VERSION=${{ steps.champion.outputs.version }}
            GIT_COMMIT=${{ env.COMMIT }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start, call /health and stop
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.champion.outputs.version }}
        run: |
          # An in-memory database: /health and the model need none, and the image's user
          # may not write to /app.
          docker run -d --name api --memory=512m -p 8000:8000 -e DATABASE_URL=sqlite:// "$IMAGE@$DIGEST"
          trap 'docker logs api; docker rm -f api' EXIT
          uv run python scripts/wait_for_health.py http://127.0.0.1:8000 \
            --model-version "$VERSION" --commit "$COMMIT" --timeout 120

      - name: Deploy to Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # By digest, so Render runs the image built above and not whatever `latest` is
          # by the time it pulls.
          curl --fail --silent --show-error --get "$RENDER_DEPLOY_HOOK_URL" \
            --data-urlencode "imgURL=$IMAGE@$DIGEST" --output /dev/null

      - name: Wait until the deployed API reports this build
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.API_URL != ''
        env:
          VERSION: ${{ steps.champion.outputs.version }}
        run: |
          uv run python scripts/wait_for_health.py "$API_URL" \
            --model-version "$VERSION" --commit "$COMMIT" --timeout 900

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MODEL: ${{ steps.champion.outputs.model }}
          VERSION: ${{ steps.champion.outputs.version }}
          BUNDLE_SHA256: ${{ steps.champion.outputs.bundle_sha256 }}
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Model | \`$MODEL\`, registry version $VERSION |"
            echo "| Bundle SHA256 | \`$BUNDLE_SHA256\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Image | \`$IMAGE@$DIGEST\` |"
            if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
              echo "| Deployed | ${API_URL:-yes (API_URL is not set, so not verified)} |"
            else
              echo "| Deployed | no: RENDER_DEPLOY_HOOK_URL is not set |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
